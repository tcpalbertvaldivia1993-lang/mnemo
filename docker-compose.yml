# Servicios de Mnemo. Fase 2: Postgres (datos de la app) y ClickHouse (analítica).
# En fases siguientes se añadirán redis y mongo.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mnemo
      POSTGRES_PASSWORD: mnemo
      POSTGRES_DB: mnemo
    ports:
      - "127.0.0.1:5433:5432"   # solo accesible desde este PC (5432 lo usa el Postgres de Windows)
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemo"]
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: mnemo
      CLICKHOUSE_PASSWORD: mnemo
      CLICKHOUSE_DB: mnemo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"   # interfaz HTTP, solo accesible desde este PC
    volumes:
      - datos_clickhouse:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      retries: 20

volumes:
  datos_postgres:
  datos_clickhouse:
