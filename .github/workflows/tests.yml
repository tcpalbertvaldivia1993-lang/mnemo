# Ejecuta los tests automáticamente en cada push y en cada pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar uv y Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Instalar dependencias (torch solo CPU, más ligero)
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu torch -r requirements.txt

      # El modelo de embeddings pesa ~500 MB: se guarda en caché entre ejecuciones.
      - name: Caché del modelo de Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      # Los tests usan SQLite en memoria y un Tutor simulado:
      # no necesitan Docker, Ollama ni claves de API.
      - name: Ejecutar los tests
        run: .venv/bin/python -m pytest -v
